<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F5C518" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="POS Hellom" />
    <link rel="apple-touch-icon" href="/assets/hellom.png" />

    <!-- App icon -->
    <link rel="icon" type="image/png" href="/assets/hellom.png" />

    <title>Hellom POS</title>

    <!-- Fonts: preconnect + non-blocking stylesheet (font-display: swap) so text paints immediately -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" /></noscript>

    <!-- Dashboard dark mode before first paint (see src/lib/colorScheme.tsx) -->
    <script>
      try {
        var hlTheme = localStorage.getItem('hellom_theme');
        if (location.pathname.indexOf('/dashboard') === 0) {
          document.documentElement.classList.add('hl-dash');
          if (hlTheme === 'dark' || (hlTheme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('hl-dark');
          }
        }
      } catch (e) {}
    </script>

    <!-- Service Worker registration (production only) -->
    <script type="module">
      if ('serviceWorker' in navigator) {
        if (import.meta.env.PROD) {
          window.addEventListener('load', function () {
            navigator.serviceWorker
              .register('/sw.js', { scope: '/' })
              .catch(function (err) {
                console.warn('[SW] Registration failed:', err);
              });
          });
        } else {
          // Dev: never let a stale service worker serve cached bundles — it breaks
          // Vite HMR and can freeze the app on old code. Unregister + purge caches.
          navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
            .catch(function () {});
          if (window.caches) {
            caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
